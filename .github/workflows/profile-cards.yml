name: Update GitHub Profile Analytics

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate profile analytics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Ratnam-1021
          cards: overview,momentum,contributions,composition,rhythm,languages
          output-dir: assets
          themes: light,dark
          language-limit: 8
          commit: true
          commit-message: "chore(profile): refresh analytics [skip ci]"
